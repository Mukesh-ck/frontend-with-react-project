<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            /* . is used to call class */
            /* # is used to call id */
            height: 200px;
            width: 200px;
            color: red;
            background: yellow;
            background-image: url('https://picsum.photoss/id/23/200/200');
            border-top: 30px solid rgba(126, 252, 0, 0.5);
            border-radius: 20px;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        .box2{
            /* . is used to call class */
            /* # is used to call id */
            height: 200px;
            width: 200px;
            color: red;
            background: rgb(43, 10, 206);
            background-image: url('https://picsum.photos/800/600');
            border: 10px solid red;
            /*  border width, border style and border color and mixed those values to single value we call it "CSS Shorthand Rule" */
            border-top: 30px solid lawngreen;
            border-radius: 30px;
        }
        .login{
            background-color: greenyellow;
            border: none;
            border-radius: 30px 50px;  
            padding: 30px 50px 10px;        
              /* top right buttom left */
        }
        .login:hover{
            background-color: orange;
        }
    </style>
</head>
<body>
    <button class="login">Login</button>
    <div>
        <h3 class="box1">Welcome to CSS</h3>
    </div>
    <div>
        <h3 class="box2">Hello</h3>
    </div>
</body>
</html>
